[tools]
maven = "3.9.9"
java = "temurin-17"
git-cliff = "latest"

[env]
COMPOSE_FILE = "target/classes/docker-compose.yml"

[tasks.build]
description = "Build project"
alias = "b"
run = "mvn clean package resources:resources -Dmaven.test.skip=true"

[tasks."docker:package"]
description = "Build docker configuration"
run = "mvn package -pl collabora-platform-extension-docker,collabora-share-extension-docker,alfresco-collabora-online-docker"

[tasks."docker:ressources"]
description = "Build docker compose configuration"
depends = ["docker:package"]
alias = "b"
run = "mvn resources:resources"

[tasks.start]
description = "Strat Docker Compose"
depends = ["docker:ressources"]
alias = "s"
run = "docker compose up --build -d"

[tasks.stop]
description = "Strat Docker Compose"
alias = "s"
run = "docker compose down"

[tasks.purge]
description = "Stop containers and remove Volumes"
alias = "s"
run = "docker compose down -v"


[tasks.clean]
description = "Maven clean"
run = "mvn clean"

[tasks."format:check"]
description = "Check Java code formatting with Spotless"
run = "mvn spotless:check"

[tasks."format:write"]
description = "Apply Java code formatting with Spotless"
run = "mvn spotless:apply"

[tasks.changelog]
description = "Generate CHANGELOG.md from git history"
run = "git-cliff -o CHANGELOG.md"

[tasks."changelog:unreleased"]
description = "Preview unreleased changes"
run = "git-cliff --unreleased"

[tasks."changelog:tag"]
description = "Generate changelog for a specific tag (usage: mise run changelog:tag -- v1.0.0)"
run = "git-cliff --unreleased --prepend CHANGELOG.md --tag"
