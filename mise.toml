[tools]
maven = "3.9.16"
java = "temurin-17"
git-cliff = "latest"
trivy = "0.74.0"

[env]
COMPOSE_FILE = "target/classes/docker-compose.yml"

[tasks.build]
description = "Build project"
alias = "b"
run = "mvn clean package resources:resources -Dmaven.test.skip=true"

[tasks."docker:package"]
description = "Build docker configuration"
run = "mvn package -pl collabora-platform-extension-docker,collabora-share-extension-docker,alfresco-collabora-online-docker"

[tasks."docker:ressources"]
description = "Build docker compose configuration"
depends = ["docker:package"]
alias = "b"
run = "mvn resources:resources"

[tasks.start]
description = "Start Docker Compose"
depends = ["docker:ressources"]
alias = "s"
run = "docker compose up --build -d"

[tasks.stop]
description = "Stop Docker Compose"
alias = "s"
run = "docker compose down"

[tasks.purge]
description = "Stop containers and remove Volumes"
alias = "s"
run = "docker compose down -v"


[tasks.clean]
description = "Maven clean"
run = "mvn clean"

[tasks."format:check"]
description = "Check Java code formatting with Spotless"
run = "mvn spotless:check"

[tasks."format:write"]
description = "Apply Java code formatting with Spotless"
run = "mvn spotless:apply"

[tasks.changelog]
description = "Generate CHANGELOG.md from git history"
run = "git-cliff -o CHANGELOG.md"

[tasks."changelog:unreleased"]
description = "Preview unreleased changes"
run = "git-cliff --unreleased"

[tasks."changelog:tag"]
description = "Generate changelog for a specific tag (usage: mise run changelog:tag -- v1.0.0)"
run = "git-cliff --unreleased --prepend CHANGELOG.md --tag"

[tasks."sbom"]
description = "Generate CycloneDX SBOMs (runtime = shipped payload, full = incl. provided)"
run = [
  "mvn -q org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom -DoutputFormat=json -DoutputName=bom-runtime -DincludeProvidedScope=false -DincludeTestScope=false",
  "mvn -q org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom -DoutputFormat=json -DoutputName=bom-full -DincludeProvidedScope=true -DincludeTestScope=false",
]

[tasks."audit"]
description = "Scan shipped dependencies for CVEs (fails on CRITICAL, same gate as CI)"
depends = ["sbom"]
run = "trivy sbom --quiet --severity CRITICAL --exit-code 1 target/bom-runtime.json"

[tasks."audit:full"]
description = "Report CVEs on the whole runtime tree, Alfresco included (never fails)"
depends = ["sbom"]
run = "trivy sbom --quiet --severity HIGH,CRITICAL target/bom-full.json"
