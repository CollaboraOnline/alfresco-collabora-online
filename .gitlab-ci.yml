---
stages:
  - security
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "stable"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+/

default:
  image: rg.fr-par.scw.cloud/public/docker.io/library/maven:3.9.16-eclipse-temurin-17-noble
  tags:
    - docker
    - jeci

variables:
  # This will supress any download for dependencies and plugins or upload messages which would clutter the console log.
  # `showDateTime` will show the passed time in milliseconds. You need to specify `--batch-mode` to make this work.
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  # As of Maven 3.3.0 instead of this you may define these options in `.mvn/maven.config` so the same config is used
  # when running from the command line.
  # `installAtEnd` and `deployAtEnd` are only effective with recent version of the corresponding plugins.
  MAVEN_CLI_OPTS: "-s ci_settings.xml --batch-mode --errors --show-version -DinstallAtEnd=true -DdeployAtEnd=true"

# Cache downloaded dependencies and plugins between builds.
# To keep cache across branches add 'key: "$CI_JOB_NAME"'
cache:
  paths:
    - .m2/repository

sbom:
  stage: security
  script:
    - source ${NEXUS_SECRET_FILE}
    - mvn $MAVEN_CLI_OPTS org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
      -DoutputFormat=json -DoutputName=bom-runtime
      -DincludeProvidedScope=false -DincludeTestScope=false
    - mvn $MAVEN_CLI_OPTS org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
      -DoutputFormat=json -DoutputName=bom-full
      -DincludeProvidedScope=true -DincludeTestScope=false
  artifacts:
    paths:
      - target/bom-runtime.json
      - target/bom-full.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+/

dependency-scan:
  stage: security
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+/
  image:
    name: rg.fr-par.scw.cloud/public/docker.io/aquasec/trivy:0.74.0
    entrypoint: [""]
  needs:
    - job: sbom
      artifacts: true
  variables:
    TRIVY_CACHE_DIR: .trivycache
    TRIVY_NO_PROGRESS: "true"
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  script:
    - trivy sbom --quiet --format json --output trivy-full.json target/bom-full.json
    - trivy convert --quiet --format table --severity HIGH,CRITICAL trivy-full.json
    - trivy sbom --quiet --format json --output trivy-runtime.json target/bom-runtime.json
    - trivy convert --quiet --format table --severity CRITICAL --exit-code 1 trivy-runtime.json
  artifacts:
    when: always
    paths:
      - trivy-full.json
      - trivy-runtime.json
    expire_in: 1 week

maven-deploy:
  stage: deploy
  script:
    - source ${NEXUS_SECRET_FILE}
    - mvn $MAVEN_CLI_OPTS deploy
  artifacts:
    paths:
      - "**/target/*.jar"
      - "**/target/*.amp"
      - "**/target/*.tgz"
  needs:
    - job: dependency-scan
      artifacts: false
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+/

sbom-publish:
  stage: deploy
  needs:
    - job: sbom
      artifacts: true
    - job: maven-deploy
      artifacts: false
  script:
    - source ${NEXUS_SECRET_FILE}
    - mvn $MAVEN_CLI_OPTS -N deploy:deploy-file@sbom-runtime deploy:deploy-file@sbom-full
  rules:
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+/
