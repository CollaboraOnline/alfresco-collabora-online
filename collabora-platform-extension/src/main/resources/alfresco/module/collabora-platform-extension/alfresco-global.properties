## This Alfresco Platform Configuration file should be used for custom properties that are introduced by this module.
## Define default values for all properties here.
## System Administrators can override these values in environment specific configurations in
## alfresco/tomcat/shared/classes/alfresco-global.properties.
##

# Collabora Online
# Public fqdn use by the browser
collabora.public.url=http://localhost:9980/

# If Collabora Online is on the same host or network, define the internal url of the server.
collabora.private.url=${collabora.public.url}

# Default: 
alfresco.public.url=${alfresco.protocol}://${alfresco.host}:${alfresco.port}/${alfresco.context}

# If Collabora Online is on the same host or network, define the internal url 
# use by collabora online to fetch document on alfresco
alfresco.private.url=${alfresco.public.url}

fr.jeci.collabora.renditions=imgpreview,medium,doclib,pdf

# Timeout in ms for connecting to and reading from Collabora discovery endpoint
fr.jeci.collabora.discovery.readTimeoutMs=500

# TTL token in ms (24h = 86400000)
lool.wopi.token.ttl=86400000

lool.cache.fileIdAccessTokenMapSharedCache.tx.maxItems=5000
lool.cache.fileIdAccessTokenMapSharedCache.tx.statsEnabled=${caches.tx.statsEnabled}
lool.cache.fileIdAccessTokenMapSharedCache.maxItems=5000
# can match lool.wopi.token.ttl (24h = 86400)
lool.cache.fileIdAccessTokenMapSharedCache.timeToLiveSeconds=86400
lool.cache.fileIdAccessTokenMapSharedCache.maxIdleSeconds=0
lool.cache.fileIdAccessTokenMapSharedCache.cluster.type=fully-distributed
lool.cache.fileIdAccessTokenMapSharedCache.backup-count=1
lool.cache.fileIdAccessTokenMapSharedCache.eviction-policy=LRU
lool.cache.fileIdAccessTokenMapSharedCache.eviction-percentage=25
lool.cache.fileIdAccessTokenMapSharedCache.merge-policy=hz.ADD_NEW_ENTRY
lool.cache.fileIdAccessTokenMapSharedCache.readBackupData=false

# Remote/Dynamic Configuration
# Folder name under /Data Dictionary/ for storing Collabora config and fonts
fr.jeci.collabora.remoteConfig.basePath=collabora-online
# Public base URL for serving font files (used in font configuration JSON)
fr.jeci.collabora.remoteConfig.fontsUrl=${alfresco.public.url}/s/collabora/fonts

# WOPI Settings API (UserSettings / SharedSettings)
# Shared (systemconfig) settings are stored under /Data Dictionary/<remoteConfig.basePath>/shared-settings/
# Per-user (userconfig) settings are stored under the user home, in this relative folder path
fr.jeci.collabora.settings.userPath=Configuration/Collabora Online
# WOPI base URL Collabora calls back for the Settings API (it appends /settings and /settings/download).
# Sent to the settings iframe as wopi_setting_base_url and used to build the download uri in Fetch settings.
fr.jeci.collabora.settings.wopiBaseUrl=${alfresco.public.url}/s/wopi

# Feature Restriction (License Management)
# Enable group-based licensing: users not in the group get IsUserLocked=true in WOPI CheckFileInfo.
# Requires feature_lock.is_lock_readonly=true in coolwsd.xml to enforce read-only for locked users.
fr.jeci.collabora.featureRestriction.enabled=false
fr.jeci.collabora.featureRestriction.group=GROUP_COLLABORA_ONLINE
# Maximum number of licenses (-1 = unlimited)
fr.jeci.collabora.featureRestriction.maxLicenses=-1
# Default sender for license change notifications (used when user has no email)
fr.jeci.collabora.featureRestriction.notificationFrom=${alfresco.host}@pristy.net

# Clean Lock
job.fr.jeci.collabora.cleanLock.cron=0 0/5 * * * ?
job.fr.jeci.collabora.cleanLock.cronstartdelay=240000
job.fr.jeci.collabora.cleanLock.enabled=false
